<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentor Workspace — DICON GITH</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--em:#0A3323;--gold:#C9A227;--line:#dfe5e2;--mut:#5f6f68}*{box-sizing:border-box}
    body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#f5f7f6;color:#16231d}
    header{background:var(--em);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;justify-content:space-between}
    header img{height:34px}header button{background:transparent;border:1px solid #ffffff66;color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}
    main{max-width:820px;margin:0 auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
    .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.mut{color:var(--mut);font-size:13px}h2{margin:0 0 6px;font-size:18px}
    button.pri{background:var(--em);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
    button.sec{background:#fff;border:1px solid var(--em);color:var(--em);border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
    textarea{width:100%;min-height:80px;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:8px 0}
    .kv{margin:8px 0}.kv b{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}.note{border-top:1px solid var(--line);padding:10px 0}
    #msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--em);color:#fff;padding:10px 16px;border-radius:10px;display:none}
  </style>
  <link rel="stylesheet" href="/css/motion.css">
</head>
<body>
  <header><div class="row" style="justify-content:flex-start"><img src="/assets/logo.png" alt=""><b>DICON GITH · Mentor Workspace</b></div><button id="logout">Sign out</button></header>
  <main id="app"><div class="card mut">Loading…</div></main><div id="msg"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script type="module" src="js/mentor-app.js"></script>
  <script src="/js/motion.js" defer></script>
<script src="/js/tour.js" defer></script>
</body>
</html>
